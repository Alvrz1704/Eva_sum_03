<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Juego Manía{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Menú limpio sin el botón de administración visible para el público -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4" href="{% url 'catalogo' %}">
                <i class="fa-solid fa-dice text-warning me-2"></i>Juego Manía
            </a>
            <div class="d-flex">
                <a href="{% url 'catalogo' %}" class="btn btn-outline-light btn-sm">
                    <i class="fa-solid fa-store me-1"></i> Catálogo / Inicio
                </a>
            </div>
        </div>
    </nav>

    <!-- Contenido dinámico -->
    <main class="container my-5 flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <small>&copy; 2026 Juego Manía - Todos los derechos reservados.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
